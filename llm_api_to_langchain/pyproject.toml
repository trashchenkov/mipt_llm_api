[project]
name = "llm-api-to-langchain"
version = "0.1.0"
description = "От API языковой модели к LangChain"
requires-python = "==3.12.*"
dependencies = [
    "gigachat==0.2.3",
    "langchain-gigachat==0.5.1",
    "openai==3.17.0",
    "anthropic==1.7.0",
    "python-dotenv==1.2.3",
    "httpx>=0.28,<0.29",
    "httpx2==2.13.0",
    "jupyterlab>=4,<5",
    "ipykernel==7.3.0",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false
